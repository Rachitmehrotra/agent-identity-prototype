apiVersion: v1
kind: ServiceAccount
metadata:
  name: sts
  namespace: agents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sts
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels: { app: sts }
  template:
    metadata:
      labels: { app: sts }
    spec:
      serviceAccountName: sts
      containers:
        - name: sts
          image: agent-identity:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "sts/app.py"]
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - { name: STS_ISSUER, value: "https://sts.agents.local" }
            # Persisted signing key — the fix for the ephemeral-key bug.
            - { name: STS_SIGNING_KEY_PATH, value: "/keys/signing-key.pem" }
            - { name: STS_TOKEN_TTL_SECONDS, value: "300" }
          volumeMounts:
            - { name: signing-key, mountPath: /keys, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
      volumes:
        - name: signing-key
          secret:
            secretName: sts-signing-key
---
apiVersion: v1
kind: Service
metadata:
  name: sts
  namespace: agents
spec:
  selector: { app: sts }
  ports: [{ port: 8080, targetPort: 8080 }]
