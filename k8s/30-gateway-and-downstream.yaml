# ------------------------------------------------------------ mcp-gateway -----
apiVersion: v1
kind: ServiceAccount
metadata: { name: mcp-gateway, namespace: agents }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-gateway, namespace: agents }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-gateway } }
  template:
    metadata: { labels: { app: mcp-gateway } }
    spec:
      serviceAccountName: mcp-gateway
      containers:
        - name: gateway
          image: agent-identity:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "mcp_gateway/app.py"]
          ports: [{ containerPort: 8080 }]
          env:
            - { name: GATEWAY_AUDIENCE, value: "mcp-gateway" }
            - { name: STS_URL, value: "http://sts:8080" }
            - { name: DOWNSTREAM_URL, value: "http://downstream:8080/pr" }
            - { name: ALLOWED_ORIGINS, value: "user:rachit@example.com" }
            - { name: ALLOWED_TOOLS, value: "open_pr,read_logs" }
            # Phase 2: set to http://opa:8181/v1/data/agent/authz to lift policy
            # into Rego. Leave empty for Phase 1 hardcoded policy.
            - { name: OPA_URL, value: "" }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: mcp-gateway, namespace: agents }
spec:
  selector: { app: mcp-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
# ------------------------------------------------------------- downstream -----
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: downstream, namespace: agents }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: downstream, namespace: agents }
spec:
  replicas: 1
  selector: { matchLabels: { app: downstream } }
  template:
    metadata: { labels: { app: downstream } }
    spec:
      serviceAccountName: downstream
      containers:
        - name: downstream
          image: agent-identity:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "downstream/app.py"]
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: downstream, namespace: agents }
spec:
  selector: { app: downstream }
  ports: [{ port: 8080, targetPort: 8080 }]
