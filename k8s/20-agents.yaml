# Three agents from one image, differentiated only by env. The workload secret
# is injected from the workload-secrets Secret (Phase 1 attestation).
# ---------------------------------------------------------------- oncall ------
apiVersion: v1
kind: ServiceAccount
metadata: { name: oncall, namespace: agents }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: oncall-agent, namespace: agents }
spec:
  replicas: 1
  selector: { matchLabels: { app: oncall-agent } }
  template:
    metadata: { labels: { app: oncall-agent } }
    spec:
      serviceAccountName: oncall
      containers:
        - name: agent
          image: agent-identity:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "agents/app.py"]
          ports: [{ containerPort: 8080 }]
          env:
            - { name: AGENT_ROLE, value: "oncall" }
            - { name: AGENT_ID, value: "oncall-agent" }
            - { name: WORKLOAD_ID, value: "spiffe://agents.local/ns/agents/sa/oncall" }
            - name: WORKLOAD_SECRET
              valueFrom: { secretKeyRef: { name: workload-secrets, key: oncall } }
            - { name: NEXT_HOP_AUDIENCE, value: "investigation-agent" }
            - { name: NEXT_HOP_URL, value: "http://investigation-agent:8080/handle" }
            - { name: STS_URL, value: "http://sts:8080" }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: oncall-agent, namespace: agents }
spec:
  selector: { app: oncall-agent }
  ports: [{ port: 8080, targetPort: 8080 }]
