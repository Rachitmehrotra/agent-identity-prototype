apiVersion: v1
kind: Namespace
metadata:
  name: agents
  labels:
    # Pre-labeled: the moment you install Istio (Phase 2), sidecars inject here.
    istio-injection: enabled
---
# Phase 1 workload attestation secrets (mock SPIRE). Phase 3 deletes these and
# lets the SPIRE Agent issue real SVIDs via the Workload API socket instead.
apiVersion: v1
kind: Secret
metadata:
  name: workload-secrets
  namespace: agents
type: Opaque
stringData:
  oncall: oncall-phase1-secret
  investigation: investigation-phase1-secret
  monitoring: monitoring-phase1-secret
---
# The STS signing key is created by scripts/bootstrap.sh from a persisted PEM so
# the key survives pod restarts (the fix for the ephemeral-key verification bug).
# Placeholder here documents the expected shape; bootstrap.sh overwrites it.
apiVersion: v1
kind: Secret
metadata:
  name: sts-signing-key
  namespace: agents
type: Opaque
stringData:
  signing-key.pem: "REPLACED_BY_BOOTSTRAP"
